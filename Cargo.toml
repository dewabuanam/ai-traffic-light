[workspace]
resolver = "2"
members = ["crates/core", "crates/hook", "src-tauri"]

[workspace.package]
version = "1.5.1"
edition = "2021"
rust-version = "1.77.2"
authors = ["Quartex Software"]

[workspace.dependencies]
ai-traffic-lights-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = "0.59"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
