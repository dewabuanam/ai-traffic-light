[package]
name = "claude-light-hook"
description = "Claude Code hook helper that publishes session status"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[[bin]]
name = "claude-light-hook"
path = "src/main.rs"

[dependencies]
ai-traffic-lights-core.workspace = true
serde_json.workspace = true

# Only the hook runs inside the session, so it is the only thing that can see
# which console and which process tree the session belongs to.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
] }
