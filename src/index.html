<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Traffic Light</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-housing="solid">
    <!-- One window, one light: which session it shows comes from the query
         string that `lights.rs` builds. Dragging is handled in `main.js` rather
         than with `data-tauri-drag-region`, so that a click on the light can
         stay a click and focus that session's terminal. -->
    <div id="light" class="light">
      <div id="housing" class="housing vertical" title="Claude status">
        <div class="lamp red"><span class="bulb"></span></div>
        <div class="lamp yellow"><span class="bulb"></span></div>
        <div class="lamp green"><span class="bulb"></span></div>
      </div>
      <div id="label" class="label"></div>
    </div>

    <div id="grip" class="grip" title="Drag to resize"></div>

    <script type="module" src="main.js"></script>
  </body>
</html>
