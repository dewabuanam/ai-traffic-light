<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Traffic Light</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body data-housing="solid">
    <!-- One light per live session, built in `main.js`. Dragging the window is
         handled there too rather than with `data-tauri-drag-region`, so that a
         click on a light can stay a click and focus that session's terminal. -->
    <div id="lights" class="lights vertical"></div>

    <div id="grip" class="grip" title="Drag to resize"></div>

    <script type="module" src="main.js"></script>
  </body>
</html>
